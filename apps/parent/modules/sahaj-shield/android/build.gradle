plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sahaj.shield'
version = '0.1.0'

android {
  namespace "app.sahaj.shield"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.all {
      testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
      }
    }
  }
}

dependencies {
  // JVM unit tests cover app.sahaj.shield.core only (no Android classes there).
  testImplementation 'junit:junit:4.13.2'
}
