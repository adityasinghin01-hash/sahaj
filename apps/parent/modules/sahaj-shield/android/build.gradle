plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sahaj.shield'
version = '0.1.0'

// The real rules engine (app.sahaj.shield.rules.JsonRulesEngine) lives in packages/shield-kotlin and is
// compiled straight into this module from its source dir, so there is one copy of the code.
// projectDir = apps/parent/modules/sahaj-shield/android → five levels up is the repo root.
def repoRoot = new File(projectDir, '../../../../..').canonicalFile
def shieldKotlinSrc = new File(repoRoot, 'packages/shield-kotlin/src/main/kotlin')
def shieldRulesJson = new File(repoRoot, 'packages/shield/rules/rules.json')
if (!shieldKotlinSrc.isDirectory()) {
  throw new GradleException("sahaj-shield: rules engine sources not found at ${shieldKotlinSrc}")
}

// Optional recordings live outside res/ so README.txt is never compiled as an Android resource.
def warningClipNames = (1..8).collect { "shield_line_${it}.mp3" } + ['shield_line_9a.mp3', 'shield_line_9b.mp3']
def warningClipDirectory = new File(projectDir, '../warning-clips')
def warningClipResources = layout.buildDirectory.dir('generated/res/shieldWarningClips')
def stageShieldWarningClips = tasks.register('stageShieldWarningClips') {
  inputs.files(fileTree(dir: warningClipDirectory, includes: warningClipNames))
  outputs.dir(warningClipResources)
  doLast {
    def output = warningClipResources.get().asFile
    // Run even with zero MP3 inputs, so removed recordings cannot survive as stale resources.
    project.delete(output)
    output.mkdirs()
    project.copy {
      from(warningClipDirectory) { include(warningClipNames) }
      into(new File(output, 'raw'))
    }
  }
}

android {
  namespace "app.sahaj.shield"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // R8 keep rules for the app's release build (WorkManager's Room database + Shield classes).
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets {
    main {
      res.srcDir warningClipResources.get().asFile
      java.srcDirs += shieldKotlinSrc
    }
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.all {
      // The real-engine test reads the same rules.json that prebuild bundles as an asset.
      systemProperty 'sahaj.rulesJson', shieldRulesJson.absolutePath
      // Phase 2 test: the <queries> list in the config plugin must match AppLists.REMOTE_CONTROL.
      systemProperty 'sahaj.pluginJs', new File(projectDir, '../app.plugin.js').canonicalPath
      testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
      }
    }
  }
}

dependencies {
  // Same version as packages/shield-kotlin/build.gradle.kts (JsonRulesEngine parses rules.json with it).
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
  // Step 3.2: installed-app scan every 6 h.
  implementation 'androidx.work:work-runtime:2.10.5'
  // JVM unit tests cover app.sahaj.shield.core and app.sahaj.shield.rules (no Android classes there).
  testImplementation 'junit:junit:4.13.2'
}

// The generated resource folder must be populated before resource merging starts.
tasks.named('preBuild').configure { dependsOn(stageShieldWarningClips) }
